<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addi Tech AI Prompt Studio & Multi-Size Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; text-align: left; }
        .container { max-width: 800px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #d946ef; text-align: center; margin-bottom: 5px; font-size: 28px; font-weight: bold; }
        .sub-title { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 30px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; color: #334155; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; background: #fff; }
        
        .btn { background-color: #d946ef; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; text-align: center; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background-color: #c026d3; }

        .prompt-output { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; word-break: break-all; margin-top: 12px; min-height: 60px; }

        /* پریویو باکس اور Addi Tech لوگو واٹر مارک */
        .preview-box { background: #fdf4ff; border: 2px dashed #d946ef; padding: 25px; border-radius: 10px; margin-top: 25px; text-align: center; display: none; }
        .image-wrapper { position: relative; display: inline-block; max-width: 100%; margin-top: 15px; }
        .preview-img { width: 100%; height: auto; border-radius: 8px; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .watermark-logo { position: absolute; bottom: 15px; right: 15px; background: rgba(30, 41, 59, 0.9); color: #38bdf8; padding: 6px 14px; font-size: 12px; font-weight: bold; border-radius: 4px; letter-spacing: 1px; border: 1px solid #38bdf8; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.3); pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Addi Tech AI Prompt Studio</h2>
    <div class="sub-title">✨ Professional AI Image Prompt Generator & Multi-Size Studio with Watermark</div>

    <label>Enter Image Idea / Subject (e.g. Professional Office Boy working, Modern Cyber City):</label>
    <input type="text" id="promptIdea" placeholder="Describe what you want to create...">

    <label>Select Desired Image Size / Format:</label>
    <select id="promptSize">
        <option value="Fiverr Gig Cover (1280x769 px) --ar 16:10">Fiverr Gig Cover (1280x769)</option>
        <option value="YouTube Thumbnail (1280x720 px) --ar 16:9">YouTube Thumbnail (1280x720)</option>
        <option value="Instagram Square Post (1080x1080 px) --ar 1:1">Instagram Square Post (1080x1080)</option>
        <option value="Instagram / TikTok Story (1080x1920 px) --ar 9:16">Instagram / TikTok Story (1080x1920)</option>
        <option value="Facebook Cover Photo (820x312 px) --ar 16:6">Facebook Cover Photo (820x312)</option>
        <option value="Ultra HD Wallpaper (3840x2160 px) --ar 16:9">Ultra HD Wallpaper (3840x2160)</option>
    </select>

    <label>Select Art Style:</label>
    <select id="promptStyle">
        <option value="Photorealistic, 8k resolution, highly detailed, studio lighting">Photorealistic (حقیقی اور واضح)</option>
        <option value="Modern 3D Pixar style, vibrant colors, clean studio background">3D Cartoon / Pixar Style</option>
        <option value="Minimalist corporate vector art, professional look">Corporate Minimalist Vector</option>
        <option value="Cinematic dramatic lighting, neon accents, cyber aesthetic">Cinematic & Cyber Aesthetic</option>
    </select>

    <label>Upload Sample / Base Image (Optional):</label>
    <input type="file" id="sampleImageFile" accept="image/*" style="background:#fff;">

    <button class="btn" onclick="generateAIPrompt()">✨ Generate Optimized AI Prompt & Watermark Preview</button>

    <label style="margin-top: 25px; font-weight:bold;">Generated AI Prompt:</label>
    <div id="generatedPromptResult" class="prompt-output">Your optimized prompt will appear here...</div>
    
    <button class="btn" style="background-color: #059669; margin-top: 10px; font-size: 14px; padding: 10px;" onclick="copyPromptText()">📋 Copy Prompt to Clipboard</button>

    <!-- پریویو اور Addi Tech لوگو واٹر مارک شو ہونے کی جگہ -->
    <div id="previewContainer" class="preview-box">
        <h3 style="margin-top: 0; color: #c026d3; font-size: 16px;">🖼️ Preview with "Addi Tech" Watermark Logo</h3>
        <div class="image-wrapper" id="imageWrapperDiv">
            <img id="outputPreviewImg" class="preview-img" alt="Preview Image" style="display:none;">
            <div class="watermark-logo">Addi Tech</div>
        </div>
    </div>

    <div style="text-align: center; font-size: 11px; margin-top: 30px; color: #64748b;">
        &copy; 2026 Addi Tech AI Prompt Studio. All Rights Reserved.
    </div>
</div>

<script>
    function generateAIPrompt() {
        const idea = document.getElementById('promptIdea').value.trim();
        const sizeOption = document.getElementById('promptSize').value;
        const styleOption = document.getElementById('promptStyle').value;

        if(!idea) {
            alert('Please enter an image idea or description first!');
            return;
        }

        const finalPrompt = `Create an image of: ${idea}. Style: ${styleOption}. Format specification and dimensions: ${sizeOption}, highly detailed, professional composition, trending on artstation, 8k. Watermark space at bottom right corner.`;
        document.getElementById('generatedPromptResult').innerText = finalPrompt;

        // اگر صارف نے کوئی سیمپل تصویر اپ لوڈ کی ہے تو اسے واٹر مارک کے ساتھ پریویو میں دکھائیں
        const fileInput = document.getElementById('sampleImageFile');
        const previewImg = document.getElementById('outputPreviewImg');
        const previewContainer = document.getElementById('previewContainer');

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            // اگر تصویر نہیں دی تو صرف پرامپٹ شو ہوگا
            previewContainer.style.display = 'none';
        }

        window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function copyPromptText() {
        const text = document.getElementById('generatedPromptResult').innerText;
        if(text.includes('Your optimized')) {
            alert('Please generate a prompt first!');
            return;
        }
        navigator.clipboard.writeText(text);
        alert('✨ Prompt copied to clipboard successfully!');
    }
</script>

</body>
</html>
